name: Temporary R:R boundary fix

on:
  push:
    branches:
      - fix/rr-boundary-telemetry-highs

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rr-boundary-telemetry-highs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('bot/strategy.py')
          s = p.read_text()

          anchor = "TOTAL_COST  = (TAKER_FEE + SLIPPAGE) * 2 + FUNDING_FEE\n"
          helper = '''TOTAL_COST  = (TAKER_FEE + SLIPPAGE) * 2 + FUNDING_FEE\n\n\ndef _rr_from_unrounded_levels(entry: float, raw_sl: float, raw_tp: float) -> float:\n    \"\"\"Compute R:R before exchange-price rounding can distort the ratio.\"\"\"\n    risk = abs(raw_sl - entry)\n    if risk <= 0:\n        return 0.0\n    return abs(raw_tp - entry) / risk\n'''
          if anchor not in s:
              raise SystemExit('TOTAL_COST anchor not found')
          s = s.replace(anchor, helper, 1)

          old = '''        sl_atr = max(atr_15, atr_1h * 0.5)\n        if direction == \"LONG\":\n            sl = round(price - sl_atr * sl_mult, 6)\n            tp = round(price + sl_atr * tp_mult, 6)\n        else:\n            sl = round(price + sl_atr * sl_mult, 6)\n            tp = round(price - sl_atr * tp_mult, 6)\n\n        rr = abs(tp - price) / abs(sl - price) if abs(sl - price) > 0 else 0\n        if rr < cfg.MIN_RR_RATIO:\n'''
          new = '''        sl_atr = max(atr_15, atr_1h * 0.5)\n        if direction == \"LONG\":\n            raw_sl = price - sl_atr * sl_mult\n            raw_tp = price + sl_atr * tp_mult\n        else:\n            raw_sl = price + sl_atr * sl_mult\n            raw_tp = price - sl_atr * tp_mult\n\n        # Gate R:R against the intended, unrounded geometry. Exchange price\n        # precision is applied only after the quality gate so a true 1:2\n        # setup cannot become 1.9998... solely because SL/TP were rounded.\n        rr = _rr_from_unrounded_levels(price, raw_sl, raw_tp)\n        if rr < cfg.MIN_RR_RATIO:\n'''
          if old not in s:
              raise SystemExit('R:R block not found')
          s = s.replace(old, new, 1)

          # Preserve exchange-facing six-decimal levels after the gate calculation.
          marker = '''        if rr < cfg.MIN_RR_RATIO:\n            log.debug(f\"[{symbol}] R:R {rr:.2f} < {cfg.MIN_RR_RATIO} → HOLD\")\n            return None\n\n        # ── PASSO 7: Validação de taxas ─────────────────────────\n'''
          replacement = '''        if rr < cfg.MIN_RR_RATIO:\n            log.debug(f\"[{symbol}] R:R {rr:.6f} < {cfg.MIN_RR_RATIO} → HOLD\")\n            return None\n\n        sl = round(raw_sl, 6)\n        tp = round(raw_tp, 6)\n\n        # ── PASSO 7: Validação de taxas ─────────────────────────\n'''
          if marker not in s:
              raise SystemExit('R:R gate marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          Path('tests/test_rr_boundary_precision.py').write_text('''from bot.strategy import _rr_from_unrounded_levels\n\n\ndef test_rr_boundary_uses_unrounded_geometry():\n    entry = 0.1000000\n    risk = 0.0000017\n    raw_sl = entry - risk\n    raw_tp = entry + (risk * 2.0)\n\n    # Six-decimal exchange rounding can materially distort cheap-coin R:R.\n    rounded_rr = abs(round(raw_tp, 6) - entry) / abs(round(raw_sl, 6) - entry)\n    assert rounded_rr < 2.0\n\n    # The strategy gate must evaluate the intended geometry instead.\n    rr = _rr_from_unrounded_levels(entry, raw_sl, raw_tp)\n    assert abs(rr - 2.0) < 1e-9\n    assert rr >= 2.0 - 1e-9\n\n\ndef test_rr_boundary_rejects_genuinely_subminimum_geometry():\n    entry = 100.0\n    raw_sl = 99.0\n    raw_tp = 101.9\n    assert _rr_from_unrounded_levels(entry, raw_sl, raw_tp) < 2.0\n''')
          PY

          rm .github/workflows/tmp-fix-rr-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/strategy.py tests/test_rr_boundary_precision.py .github/workflows/tmp-fix-rr-boundary.yml
          git commit -m "fix: preserve exact R:R geometry before price rounding"
          git push origin HEAD:fix/rr-boundary-telemetry-highs
