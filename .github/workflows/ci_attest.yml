# Publish an exact-SHA success marker only after both the main Quality Check
# and Supply Chain Security workflows have completed successfully for the same
# push commit. Railway consumes the marker via raw.githubusercontent.com.

name: Publish CI Attestation

on:
  workflow_run:
    workflows: ["Quality Check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  attest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Require matching Supply Chain Security success
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if ! [[ "$ATTEST_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid workflow_run head SHA: $ATTEST_SHA"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            result="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow security.yml \
              --branch main \
              --commit "$ATTEST_SHA" \
              --event push \
              --limit 10 \
              --json status,conclusion,headSha,event \
              --jq '[.[] | select(.headSha == env.ATTEST_SHA and .event == "push")][0] // {}')"

            status="$(jq -r '.status // "missing"' <<<"$result")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$result")"

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Supply Chain Security passed for $ATTEST_SHA"
              exit 0
            fi

            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "::error::Supply Chain Security completed with conclusion=$conclusion for $ATTEST_SHA"
              exit 1
            fi

            echo "Waiting for Supply Chain Security on $ATTEST_SHA (attempt ${attempt}/30, status=$status)"
            sleep 20
          done

          echo "::error::Timed out waiting for Supply Chain Security success for $ATTEST_SHA"
          exit 1

      - name: Publish exact-SHA success attestation
        env:
          ATTEST_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if ! [[ "$ATTEST_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid workflow_run head SHA: $ATTEST_SHA"
            exit 1
          fi

          git fetch --no-tags origin ci-attestations
          rm -rf /tmp/nexus-ci-attestation
          git worktree add --detach /tmp/nexus-ci-attestation FETCH_HEAD
          cd /tmp/nexus-ci-attestation

          mkdir -p passed
          printf '%s\n' "${ATTEST_SHA,,}" > "passed/${ATTEST_SHA,,}.txt"
          git add "passed/${ATTEST_SHA,,}.txt"

          if git diff --cached --quiet; then
            echo "Attestation already exists for ${ATTEST_SHA,,}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI passed ${ATTEST_SHA,,}"

          for attempt in 1 2 3; do
            if git push origin HEAD:ci-attestations; then
              echo "Published exact-SHA attestation for ${ATTEST_SHA,,}"
              exit 0
            fi
            echo "Attestation push raced; rebasing attempt ${attempt}/3"
            git fetch --no-tags origin ci-attestations
            git rebase FETCH_HEAD
          done

          echo "::error::Unable to publish exact-SHA CI attestation"
          exit 1
