name: NEXUS Real OOS Replay

on:
  pull_request:
    branches: [main]
    paths:
      # Decision-affecting code: keep in sync with bot/decision_affecting_paths.py
      # (enforced by tests/test_decision_affecting_paths.py).
      - "bot/strategy.py"
      - "bot/indicators.py"
      - "bot/score.py"
      - "bot/score_weights.py"
      - "bot/scoring_safety_hardening.py"
      - "bot/adaptive_mtf_entry.py"
      - "bot/adaptive_mtf_calibration.py"
      - "bot/pullback_confirmation_hardening.py"
      - "bot/pretrade_hardening.py"
      - "bot/rr_precision_hardening.py"
      - "bot/rr_gate_calibration.py"
      - "bot/correlation.py"
      - "bot/event_intelligence.py"
      - "bot/market_viability_fail_closed.py"
      - "bot/nexus_*.py"
      - "bot/oos_*.py"
      - "bot/market_data.py"
      - "bot/market_data_integrity.py"
      - "bot/market_risk_*.py"
      - "bot/news_*.py"
      - "bot/derivatives_news_freshness_hardening.py"
      - "bot/config.py"
      - "bot/risk.py"
      - "bot/risk_manager_v3.py"
      - "bot/risk_policy.py"
      - "bot/professional_risk.py"
      - "bot/professional_risk_adapter.py"
      - "bot/final_sizing_invariants.py"
      - "bot/final_loss_budget.py"
      - "bot/operator_runtime_policy.py"
      - "bot/operator_loss_policy.py"
      - "bot/pilot_risk_cap_hardening.py"
      - "bot/quantity.py"
      - "bot/cross_portfolio_stress.py"
      - "bot/cross_geometry_target_policy.py"
      - "bot/kucoin_contract_risk_hardening.py"
      - "bot/liquidation.py"
      - "bot/liquidation_override_guard.py"
      - "bot/daily_stop_*.py"
      - "bot/daily_tracker.py"
      - "bot/confirmed_rr_exit.py"
      - "bot/trailing_safety_hardening.py"
      - "bot/stagnation_time_hardening.py"
      - "bot/partial_tp_execution_hardening.py"
      - "bot/exit_policy_telemetry.py"
      - "bot/kucoin_execution_model.py"
      - "bot/backtest.py"
      - "bot/decision_affecting_paths.py"
      - "tests/test_nexus_oos_*.py"
      - ".github/workflows/oos_real_replay.yml"
  workflow_dispatch:

jobs:
  replay:
    name: Real historical replay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay accounting, clock-parity and robustness unit tests
        run: |
          python -m unittest tests.test_nexus_oos_edge_gate -v
          python -m unittest tests.test_nexus_oos_real_replay -v
          python -m unittest tests.test_nexus_oos_replay_full_clock -v
          python -m unittest tests.test_nexus_oos_robustness -v

      - name: Run real public-market OOS replay
        run: |
          python -m bot.nexus_oos_real_replay_corrected \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2500 \
            --output artifacts/nexus_oos_real_replay.json

      - name: Run paired-bootstrap robustness replay
        run: |
          python -m bot.nexus_oos_robustness_replay \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2500 \
            --output artifacts/nexus_oos_robustness.json

      - name: Show evidence reports
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('nexus_oos_real_replay.json', 'nexus_oos_robustness.json'):
              path = Path('artifacts') / name
              if not path.exists():
                  print(f'{name}: MISSING')
                  continue
              p = json.loads(path.read_text())
              print(f'===== {name} =====')
              if name == 'nexus_oos_real_replay.json':
                  view = {
                      'status': p.get('status'),
                      'blockers': p.get('blockers'),
                      'report': p.get('report'),
                      'symbols': p.get('symbols'),
                      'methodology': p.get('methodology'),
                  }
              else:
                  view = {
                      'status': p.get('status'),
                      'historical_context_parity_complete': p.get('historical_context_parity_complete'),
                      'symbols': p.get('symbols'),
                      'summary': (p.get('robustness') or {}).get('summary'),
                      'pooled': (p.get('robustness') or {}).get('pooled'),
                      'promotion_authority': p.get('promotion_authority'),
                      'execution_effect': p.get('execution_effect'),
                  }
              print(json.dumps(view, indent=2, sort_keys=True))
          PY

      - name: Promotion verdict (decision-affecting change)
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('artifacts') / 'nexus_oos_real_replay.json'
          status = 'MISSING'
          if path.exists():
              status = str(json.loads(path.read_text()).get('status'))
          print(f'PROMOTION_EVIDENCE_STATUS={status}')
          print('A green unit-test suite is not promotion evidence for a decision-affecting change.')
          print('Promotion requires this replay evidence plus RELEASE_READINESS.md human approval.')
          PY

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-oos-real-replay
          path: |
            artifacts/nexus_oos_real_replay.json
            artifacts/nexus_oos_robustness.json
          if-no-files-found: error
