name: NEXUS Real OOS Replay

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/nexus_oos_edge_gate.py"
      - "bot/nexus_oos_real_replay.py"
      - "bot/nexus_oos_real_replay_corrected.py"
      - "bot/nexus_oos_replay.py"
      - "bot/nexus_oos_portfolio.py"
      - "bot/nexus_oos_public_batch.py"
      - "bot/nexus_oos_robustness.py"
      - "tests/test_nexus_oos_edge_gate.py"
      - "tests/test_nexus_oos_real_replay.py"
      - "tests/test_nexus_oos_replay.py"
      - "tests/test_nexus_oos_replay_full_clock.py"
      - "tests/test_nexus_oos_portfolio.py"
      - "tests/test_nexus_oos_public_batch.py"
      - "tests/test_nexus_oos_robustness.py"
      - ".github/workflows/oos_real_replay.yml"
  push:
    branches: [main]
    paths:
      - "bot/nexus_oos_edge_gate.py"
      - "bot/nexus_oos_real_replay.py"
      - "bot/nexus_oos_real_replay_corrected.py"
      - "bot/nexus_oos_replay.py"
      - "bot/nexus_oos_portfolio.py"
      - "bot/nexus_oos_public_batch.py"
      - "bot/nexus_oos_robustness.py"
      - "tests/test_nexus_oos_public_batch.py"
      - "tests/test_nexus_oos_robustness.py"
      - ".github/workflows/oos_real_replay.yml"
  workflow_dispatch:

jobs:
  replay:
    name: Real historical replay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay accounting, clock-parity, portfolio and robustness unit tests
        run: |
          python -m unittest tests.test_nexus_oos_edge_gate -v
          python -m unittest tests.test_nexus_oos_real_replay -v
          python -m unittest tests.test_nexus_oos_replay -v
          python -m unittest tests.test_nexus_oos_replay_full_clock -v
          python -m unittest tests.test_nexus_oos_portfolio -v
          python -m unittest tests.test_nexus_oos_public_batch -v
          python -m unittest tests.test_nexus_oos_robustness -v

      - name: Run 12-symbol public-market OOS evidence batch
        run: |
          python -m bot.nexus_oos_public_batch \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT ADAUSDT DOGEUSDT LINKUSDT AVAXUSDT DOTUSDT LTCUSDT NEARUSDT ATOMUSDT \
            --limit-15m 2500 \
            --output-dir artifacts/nexus_oos_public \
            --bootstrap-samples 4000 \
            --temporal-folds 4

      - name: Validate full-universe robustness evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/nexus_oos_public/nexus_oos_portfolio_report.json')
          payload = json.loads(path.read_text())
          requested = payload.get('requested_symbols') or []
          summary = (payload.get('robustness') or {}).get('summary') or {}
          evaluated = int(summary.get('symbols_evaluated', 0) or 0)
          if evaluated != len(requested):
              raise SystemExit(
                  f'robustness universe mismatch: requested={len(requested)} evaluated={evaluated}'
              )
          if summary.get('promotion_role') != 'BLOCK_ONLY':
              raise SystemExit('robustness promotion role drifted from BLOCK_ONLY')
          print(json.dumps({
              'requested_symbols': requested,
              'robustness_symbols_evaluated': evaluated,
              'robustness_blockers': payload.get('robustness_blockers'),
              'robustness_summary': summary,
          }, indent=2, sort_keys=True))
          PY

      - name: Show evidence reports
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('artifacts/nexus_oos_public/nexus_oos_portfolio_report.json'),
              Path('artifacts/nexus_oos_public/nexus_oos_robustness.json'),
          ]
          for path in paths:
              if not path.exists():
                  print(f'{path}: MISSING')
                  continue
              p = json.loads(path.read_text())
              print(f'===== {path.name} =====')
              if path.name == 'nexus_oos_portfolio_report.json':
                  view = {
                      'status': p.get('status'),
                      'blockers': p.get('blockers'),
                      'robustness_blockers': p.get('robustness_blockers'),
                      'robustness_summary': (p.get('robustness') or {}).get('summary'),
                      'portfolio_report': p.get('portfolio_report'),
                      'requested_symbols': p.get('requested_symbols'),
                      'successful_symbols': p.get('successful_symbols'),
                      'failed_symbols': p.get('failed_symbols'),
                      'historical_context_parity_complete': p.get('historical_context_parity_complete'),
                      'bootstrap_unit': p.get('bootstrap_unit'),
                      'dataset_sha256': p.get('dataset_sha256'),
                      'methodology': p.get('methodology'),
                  }
              else:
                  view = {
                      'status': p.get('status'),
                      'blockers': p.get('blockers'),
                      'requested_symbols': p.get('requested_symbols'),
                      'successful_symbols': p.get('successful_symbols'),
                      'summary': (p.get('robustness') or {}).get('summary'),
                      'promotion_authority': p.get('promotion_authority'),
                      'promotion_role': p.get('promotion_role'),
                      'execution_effect': p.get('execution_effect'),
                  }
              print(json.dumps(view, indent=2, sort_keys=True))
          PY

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-oos-real-replay
          path: |
            artifacts/nexus_oos_public/nexus_oos_portfolio_candidates.csv
            artifacts/nexus_oos_public/nexus_oos_portfolio_report.json
            artifacts/nexus_oos_public/nexus_oos_robustness.json
          if-no-files-found: error
