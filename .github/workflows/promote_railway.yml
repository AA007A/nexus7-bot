name: Prepare Railway Promotion

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main SHA to promote
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-promotion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact main SHA and CI attestation
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail

          TARGET_SHA="${TARGET_SHA,,}"
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be an exact 40-character commit SHA"
            exit 1
          fi

          git fetch --no-tags origin main ci-attestations
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::target_sha=$TARGET_SHA is not current main=$MAIN_SHA"
            exit 1
          fi

          ATTESTED="$(git show "origin/ci-attestations:passed/$TARGET_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
          if [[ "$ATTESTED" != "$TARGET_SHA" ]]; then
            echo "::error::Exact Quality+Security attestation missing for $TARGET_SHA"
            exit 1
          fi

          echo "PROMOTION_TARGET=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Create promotion branch and review PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "$PROMOTION_TARGET" | cut -c1-12)"
          BRANCH="railway-promote-$SHORT_SHA-$GITHUB_RUN_ID"
          git switch -c "$BRANCH" origin/main
          mkdir -p .railway
          printf '%s\n' "$PROMOTION_TARGET" > .railway/promote.txt

          git add .railway/promote.txt
          if git diff --cached --quiet; then
            echo "::error::This SHA is already the current promotion marker"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "promote: Railway production $SHORT_SHA"
          git push origin "$BRANCH"

          BODY="Explicit Railway production promotion for exact main SHA $PROMOTION_TARGET.

Preconditions verified:
- target is the current main HEAD;
- exact Quality+Security attestation exists on ci-attestations.

This PR changes only .railway/promote.txt, the sole Railway Watch Path for nexus7-bot. Railway must still pass python -m bot.ci_deploy_gate before runtime deployment.

Do not add code changes to this promotion PR."

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Promote Railway: $SHORT_SHA" \
            --body "$BODY"
